# 统一质量门禁：任一红灯不合并
# 对应文档：测试评估验收方案.md 第 7 节 / 部署工程化.md 第五节
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：ruff → mypy → pytest(含覆盖率) ----------------
  backend:
    name: backend · lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 目录存在性检查
        id: guard
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ 尚未初始化，跳过后端门禁"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装工具链
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 锁文件唯一口径（requirements.lock 精确闭包 + dev 锁；散装 pip install 禁止加回，升级改锁文件）
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
          pip check

      - name: ruff check
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: ruff format --check .

      - name: mypy（宽松模式，缺注解不报错）
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: mypy app

      - name: pytest + coverage
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      # 迁移链门禁：全新库 upgrade → alembic check 防「模型改了迁移没跟」→ PG 方言离线出 SQL
      - name: alembic 迁移链（upgrade / drift check / PG 离线）
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: |
          # psycopg2-binary 已随 requirements-dev.lock 装好（同 job 环境透传），此处不再散装
          export DATABASE_URL="sqlite+aiosqlite:///./ci_migration.db"
          alembic upgrade head
          alembic check
          DATABASE_URL="postgresql+asyncpg://u:p@localhost/db" alembic upgrade head --sql > /dev/null
          echo "迁移链 PASS：SQLite 全量可跑、模型无漂移、PG 方言可编译"

      # 检索质量门禁：黄金集 200 条 retrieval 模式（无外部依赖），阈值在 eval_golden.py 单源
      - name: 黄金集检索评估（grounded≥0.95 / 幻觉≤0.02）
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: python scripts/eval_golden.py

      - name: 上传覆盖率
        if: steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------- 前端：lint → typecheck → test → build ----------------
  frontend:
    name: frontend · lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 目录存在性检查
        id: guard
        run: |
          if [ -f frontend/package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ 尚未初始化，跳过前端门禁"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          # 唯一源头是 frontend/package.json 的 packageManager（当前 9.12.0），此处钉同值，禁止 floating major
          version: 9.12.0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          # 与 frontend/.nvmrc 同值（改版本时两处同步改，门禁 scripts/check_toolchain.py 硬拦漂移）
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: eslint（0 errors，类型注解可选）
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: stylelint
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm stylelint
        continue-on-error: true

      - name: prettier --check
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm format:check

      - name: typecheck（vue-tsc，宽松模式缺注解不报错）
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm typecheck

      - name: vitest
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm test

      - name: build
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm build

  # ---------------- 安全扫描：初期只告警不阻断（对应 ADR-0002） ----------------
  # 升级路径：团队适应后把 exit-code 改为 '1' 即转为硬门禁，无需改其他行。
  security:
    name: security · trivy 告警（非阻断）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 文件系统扫描（HIGH/CRITICAL 只告警）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

  # ---------------- 提交信息规范（PR 场景兜底 husky 被绕过） ----------------
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 PR 内所有提交信息
        run: |
          npx --yes commitlint@19 \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
      # 信息/内容一致性（与本地 commit-msg 钩子同一脚本）：治「信息说 A 提交是 B」
      - name: 提交信息/内容一致性检查
        run: |
          fail=0
          for sha in $(git log --format=%H \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            git -c core.quotepath=false show --name-only --format= "$sha" > /tmp/files.txt
            if ! python3 scripts/check_commit_sync.py --msg /tmp/msg.txt --files /tmp/files.txt; then
              echo "::error::提交 $sha 信息与内容不一致"
              fail=1
            fi
          done
          exit $fail

  # ---------------- 文档联动门禁：接口与文档必须同改（对应 AGENTS.md §5） ----------------
  docs-guard:
    name: docs-guard · 接口/文档同改检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 必备文档存在性
        run: |
          test -f AGENTS.md || (echo "::error::缺少 AGENTS.md 唯一入口" && exit 1)
          test -f "API接口与SSE事件协议规范.md" || (echo "::error::缺少 API 规范" && exit 1)
          test -f "数据模型与存储设计.md" || (echo "::error::缺少数据模型文档" && exit 1)
          test -f "RAG知识库构建检索治理规范.md" || (echo "::error::缺少 RAG 规范" && exit 1)
          test -f "页面设计.md" || test -f "多模态智能电商客服系统页面设计.md" || (echo "::error::缺少页面设计文档" && exit 1)
      - name: 接口与文档同改检查
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::取不到有效基线，仅做存在性检查"
            exit 0
          fi
          # core.quotepath=false：否则中文文件名被转成八进制转义，后面的 grep 永远匹配不上（假阳性）
          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE" "$HEAD" || true)
          echo "$CHANGED"
          fail=0
          echo "$CHANGED" | grep -q "^backend/app/api/" && ! echo "$CHANGED" | grep -q "API接口与SSE事件协议规范.md" && { echo "::error::改了后端路由/schema 必须同 PR 改 API接口与SSE事件协议规范.md"; fail=1; }
          # RAG 无独立目录：按实现文件显式列（与 scripts/check_docs_link.py 同步，漏一个即门禁 silent）
          echo "$CHANGED" | grep -Eq "^(backend/app/services/(knowledge_service|rag_governance|vector_store|rerank_service|document_service|doc_parse_service)\.py|backend/app/modules/agent/connectors\.py|backend/seed/|backend/scripts/eval_golden\.py)" && ! echo "$CHANGED" | grep -q "RAG知识库构建检索治理规范.md" && { echo "::error::改了 RAG 必须同 PR 改 RAG规范"; fail=1; }
          echo "$CHANGED" | grep -Eq "^frontend/src/(views|components|composables|stores|types)/" && ! echo "$CHANGED" | grep -q "页面设计.md" && { echo "::error::改了页面/组件/路由 必须同 PR 改 页面设计.md"; fail=1; }
          echo "$CHANGED" | grep -q "^backend/app/db/" && ! echo "$CHANGED" | grep -q "数据模型与存储设计.md" && { echo "::error::改了表/迁移 必须同 PR 改 数据模型文档"; fail=1; }
          exit $fail

  # ---------------- 设计先行门禁：UI 代码与 design.pen 画板必须同改（对应 AGENTS.md §5） ----------------
  # 检查项与规则正文在 scripts/check_design.py（单一实现，不在此处重复逻辑）
  # design.pen 走 Git LFS：checkout 必须 lfs:true，否则落盘的是指针文本、结构检查无意义
  design-guard:
    name: design-guard · 设计稿与代码同改检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: 画板结构 / 命名 / 路由覆盖 / 色值一致性
        run: python scripts/check_design.py
      - name: UI 改动与 design.pen 同改
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::取不到有效基线，跳过同改检查"
            exit 0
          fi
          python scripts/check_design.py --range "$BASE..$HEAD"

  # ---------------- 体积门禁：新增大二进制必须走 LFS（治历史只增不减，对应 .gitattributes） ----------------
  # 本地同规则在 pre-commit large-files-guard；此处是硬门禁（任一红灯不合并）
  large-files:
    name: large-files · 新增大二进制拦截
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拦截新增超 100KB 二进制直入库
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::取不到有效基线，跳过大文件检查"
            exit 0
          fi
          python scripts/check_large_files.py --range "$BASE..$HEAD"

  # ---------------- 工具链门禁：Node/pnpm 三处声明必须对齐（源头 .nvmrc + packageManager） ----------------
  # 本地同规则在 pre-commit toolchain-guard；此处是硬门禁（任一红灯不合并）
  toolchain:
    name: toolchain · Node/pnpm 版本对齐
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 五源交叉比对（Dockerfile/CI/发版/engines）
        run: python scripts/check_toolchain.py

  # ---------------- 版本门禁：项目版本三源必须对齐（源头 执行步骤.md 头部版本） ----------------
  # 本地同规则在 pre-commit version-guard；此处是硬门禁（任一红灯不合并）
  # 修好后 release.yml 的 tag-vs-package.json 检查自然正确，发版只需打 tag 推送
  version:
    name: version · 项目版本三源对齐
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 三源交叉比对（执行步骤头/package.json/APP_VERSION）
        run: python scripts/check_version.py

  # ---------------- 失败自动诊断已迁出：见 .github/workflows/ai-diagnose.yml ----------------
  # 为什么不在本文件里做：诊断需要读「失败日志」，而 gh run view --log-failed 对**仍在进行中**
  # 的 run 取不到日志（本 job 属于该 run，永远处于进行中）→ 旧实现拿到空文件后静默跳过，
  # 表现为 job 绿灯但没有任何输出。改为 workflow_run 触发（等 ci 跑完再诊断）日志才取得到。

# 已落地（对应 ADR-0002 / 部署工程化.md §五/§十二/§十三）：
#   - security job：Trivy fs 扫描只告警（exit-code 0），适应后改 1 即转硬门禁
#   - package.yml：前后端镜像推送（latest + 短 sha + 版本号）+ Trivy 镜像扫描（同为告警级）
#   - cd-update.yml：package 成功后把短 sha 写进部署仓库（应用仓只提交代码，不直接部署）
#   - deploy/argocd/：dev 自动同步，prod 手动同步（生产发布必须人工审批）
#   - 回滚 = 部署仓库 image tag 切回上一版本（ArgoCD 自动同步，<5min）
#   - ai-diagnose：CI 红灯时由 ai-diagnose.yml 诊断（workflow_run 触发，见该文件头注释）
