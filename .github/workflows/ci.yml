# 统一质量门禁：任一红灯不合并
# 对应文档：测试评估验收方案.md 第 7 节 / 部署工程化.md 第五节
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：ruff → mypy → pytest(含覆盖率) ----------------
  backend:
    name: backend · lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 目录存在性检查
        id: guard
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ 尚未初始化，跳过后端门禁"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装工具链
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.7 mypy pytest pytest-asyncio pytest-cov httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: ruff check
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: ruff format --check .

      - name: mypy（宽松模式，缺注解不报错）
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: mypy app

      - name: pytest + coverage
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率
        if: steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------- 前端：lint → typecheck → test → build ----------------
  frontend:
    name: frontend · lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 目录存在性检查
        id: guard
        run: |
          if [ -f frontend/package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ 尚未初始化，跳过前端门禁"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: eslint（0 errors，类型注解可选）
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: stylelint
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm stylelint
        continue-on-error: true

      - name: prettier --check
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm format:check

      - name: typecheck（vue-tsc，宽松模式缺注解不报错）
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm typecheck

      - name: vitest
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm test

      - name: build
        if: steps.guard.outputs.ok == 'true'
        working-directory: frontend
        run: pnpm build

  # ---------------- 安全扫描：初期只告警不阻断（对应 ADR-0002） ----------------
  # 升级路径：团队适应后把 exit-code 改为 '1' 即转为硬门禁，无需改其他行。
  security:
    name: security · trivy 告警（非阻断）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 文件系统扫描（HIGH/CRITICAL 只告警）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

  # ---------------- 提交信息规范（PR 场景兜底 husky 被绕过） ----------------
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 PR 内所有提交信息
        run: |
          npx --yes commitlint@19 \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # ---------------- 文档联动门禁：接口与文档必须同改（对应 AGENTS.md §5） ----------------
  docs-guard:
    name: docs-guard · 接口/文档同改检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 必备文档存在性
        run: |
          test -f AGENTS.md || (echo "::error::缺少 AGENTS.md 唯一入口" && exit 1)
          test -f "API接口与SSE事件协议规范.md" || (echo "::error::缺少 API 规范" && exit 1)
          test -f "数据模型与存储设计.md" || (echo "::error::缺少数据模型文档" && exit 1)
          test -f "RAG知识库构建检索治理规范.md" || (echo "::error::缺少 RAG 规范" && exit 1)
          test -f "页面设计.md" || test -f "多模态智能电商客服系统页面设计.md" || (echo "::error::缺少页面设计文档" && exit 1)
      - name: 接口与文档同改检查
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::取不到有效基线，仅做存在性检查"
            exit 0
          fi
          # core.quotepath=false：否则中文文件名被转成八进制转义，后面的 grep 永远匹配不上（假阳性）
          CHANGED=$(git -c core.quotepath=false diff --name-only "$BASE" "$HEAD" || true)
          echo "$CHANGED"
          fail=0
          echo "$CHANGED" | grep -q "^backend/app/api/" && ! echo "$CHANGED" | grep -q "API接口与SSE事件协议规范.md" && { echo "::error::改了后端路由/schema 必须同 PR 改 API接口与SSE事件协议规范.md"; fail=1; }
          echo "$CHANGED" | grep -q "^backend/app/modules/agent/rag/" && ! echo "$CHANGED" | grep -q "RAG知识库构建检索治理规范.md" && { echo "::error::改了 RAG 必须同 PR 改 RAG规范"; fail=1; }
          echo "$CHANGED" | grep -Eq "^frontend/src/(views|components|composables|stores|types)/" && ! echo "$CHANGED" | grep -q "页面设计.md" && { echo "::error::改了页面/组件/路由 必须同 PR 改 页面设计.md"; fail=1; }
          echo "$CHANGED" | grep -q "^backend/app/db/" && ! echo "$CHANGED" | grep -q "数据模型与存储设计.md" && { echo "::error::改了表/迁移 必须同 PR 改 数据模型文档"; fail=1; }
          exit $fail

  # ---------------- 设计先行门禁：UI 代码与 design.pen 画板必须同改（对应 AGENTS.md §5） ----------------
  # 检查项与规则正文在 scripts/check_design.py（单一实现，不在此处重复逻辑）
  design-guard:
    name: design-guard · 设计稿与代码同改检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 画板结构 / 命名 / 路由覆盖 / 色值一致性
        run: python scripts/check_design.py
      - name: UI 改动与 design.pen 同改
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::取不到有效基线，跳过同改检查"
            exit 0
          fi
          python scripts/check_design.py --range "$BASE..$HEAD"

  # ---------------- 失败自动诊断：红灯时 AI 分析日志并给出修复建议（只诊断不改码） ----------------
  # 输出：run Summary + commit/PR 评论。修复动作始终由人工执行，AI 不直接改代码。
  ai-diagnose:
    name: ai-diagnose · 失败日志 AI 诊断
    needs: [backend, frontend, security, commitlint, docs-guard, design-guard]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: 收集失败 job 日志
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ github.run_id }}" --log-failed > failed.log 2>/dev/null || true
          if [ ! -s failed.log ]; then
            echo "::notice::未取到失败日志（可能被取消或无失败步骤），跳过诊断"
            echo "has_log=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tail -c 30000 failed.log > failed-trim.log
          echo "has_log=true" >> "$GITHUB_OUTPUT"

      - name: 调 GLM 生成诊断报告
        if: steps.collect.outputs.has_log == 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          SYSTEM_PROMPT='你是资深 DevOps 工程师。基于下面的 GitHub Actions 失败日志与 workflow 定义，用中文输出诊断报告，严格遵循以下结构：
          ## 结论
          （一句话：哪个 job 的哪一步、什么性质的失败）
          ## 根因
          （技术细节；区分属于 代码问题 / 依赖或版本问题 / 基础设施问题）
          ## 修复建议
          （给出具体可执行的修改：文件、命令或代码片段；若日志信息不足，说明还需要什么信息）
          要求：只依据日志与 workflow 内容，不要臆测；若日志被截断看不到根因，明确指出。'
          COMMIT=$(git log -1 --format='%h %s' 2>/dev/null || true)
          USER_CONTENT="$(printf '### 触发提交\n%s\n\n### 失败日志（最后 30KB）\n\n```\n%s\n```\n\n### workflow 定义（.github/workflows/ci.yml）\n\n```yaml\n%s\n```\n' \
            "$COMMIT" "$(cat failed-trim.log)" "$(cat .github/workflows/ci.yml)")"
          REQ=$(jq -n --arg sys "$SYSTEM_PROMPT" --arg user "$USER_CONTENT" \
            '{model:"glm-4.5-flash", messages:[{role:"system",content:$sys},{role:"user",content:$user}], temperature:0.2, max_tokens:4096}')
          RESP=$(curl -sS --max-time 300 https://open.bigmodel.cn/api/paas/v4/chat/completions \
            -H "Authorization: Bearer $ZHIPU_API_KEY" -H "Content-Type: application/json" -d "$REQ")
          CONTENT=$(printf '%s' "$RESP" | jq -r '.choices[0].message.content // empty')
          if [ -z "$CONTENT" ]; then
            echo "::warning::GLM 未返回内容，原始响应（前 2000 字符）："
            printf '%s\n' "$RESP" | head -c 2000
            exit 0
          fi
          {
            echo "> AI 诊断（glm-4.5-flash 自动生成，仅供参考；修复以人工执行为准）"
            echo ""
            printf '%s\n' "$CONTENT"
          } > diagnosis.md

      - name: 写入 run Summary 并发评论
        if: steps.collect.outputs.has_log == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f diagnosis.md ] || { echo "::notice::无诊断报告可发布"; exit 0; }
          DIAG=$(cat diagnosis.md)
          cat diagnosis.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$DIAG"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$DIAG" > /dev/null
          fi

# 已落地（对应 ADR-0002 / 部署工程化.md §五/§十二/§十三）：
#   - security job：Trivy fs 扫描只告警（exit-code 0），适应后改 1 即转硬门禁
#   - package.yml：前后端镜像推送（latest + 短 sha + 版本号）+ Trivy 镜像扫描（同为告警级）
#   - cd-update.yml：package 成功后把短 sha 写进部署仓库（应用仓只提交代码，不直接部署）
#   - deploy/argocd/：dev 自动同步，prod 手动同步（生产发布必须人工审批）
#   - 回滚 = 部署仓库 image tag 切回上一版本（ArgoCD 自动同步，<5min）
#   - ai-diagnose：CI 红灯时 AI 分析失败日志，报告发 run Summary + commit/PR 评论（只诊断不改码）
