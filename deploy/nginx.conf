# LEGACY 手动覆盖示例： canonical 口径已收进镜像（frontend/nginx.conf.template + BACKEND_UPSTREAM，默认 backend:8000），
# compose 不再挂载本文件；仅当你需要绕开环境变量、手工定制 Nginx 全量配置时，才用 -v 挂载本文件覆盖。
# 内容与镜像默认渲染结果（BACKEND_UPSTREAM=backend:8000）一致；改模板时须同步本文件，SSE 三件套（off/1h/Connection 空）缺一不可。
# Compose 组网专用 Nginx 配置：/api 同源反代到 backend 服务（对应部署工程化.md §八/§十）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
