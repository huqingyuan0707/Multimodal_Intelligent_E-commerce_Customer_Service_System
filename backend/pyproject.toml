# 后端工具链基线（仅配置段，不声明 [project]，避免干扰实际依赖管理方式）
# 对应 skill: backend-code-style ｜ 文档: 测试评估验收方案.md 第 7 节

# ---------------- Ruff：lint + format ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "venv"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade（强制 PEP 604 写法，如 str | None）
  "B",     # flake8-bugbear
  "C4",    # comprehensions
  "SIM",   # simplify
  "ASYNC", # 异步误用（禁止 async 里直接调阻塞库）
  "TID",   # 导入整洁
  "C901",  # mccabe 圈复杂度（防屎山门禁，见 skill anti-shit-code §2）
  "RUF",
]
ignore = [
  "E501",  # 行长交给 formatter
  "RUF001",  # 中文用户文案必需全角标点，不适用英文混淆字符规则
  "RUF002",  # 中文 docstring 必需全角标点，同上
  "RUF003",  # 中文注释必需全角标点，同上
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B011"]
"scripts/**" = ["T201", "E402"]  # 脚本需先注入 sys.path 才能 import app.*
"app/api/**/*.py" = ["B008"]  # FastAPI 官方写法：Depends 写在参数默认值
"app/core/rbac.py" = ["B008"]  # 同上（get_current_user / require_perm）

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 15  # 超过即 error（当前存量 0 处，只准保持）

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------- mypy：类型检查（宽松模式：注解可选，不写也不报错） ----------------
[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_return_any = false
warn_unreachable = false
warn_no_return = false
strict_equality = false
show_error_codes = true
pretty = true
# 三方库（chromadb / 模型 SDK）多数无类型存根，避免误报阻塞 CI
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

# ---------------- pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# --basetemp 固定到项目内：Windows 下 %TEMP%\pytest-of-<user> 可能不可写，导致 tmp_path 用例 PermissionError
addopts = "-q --strict-markers --strict-config --basetemp=.pytest-tmp"
markers = [
  "smoke: 需要真实后端进程的联调脚本",
  "slow: 耗时用例（模型加载、向量库）",
]

# ---------------- coverage（门禁：低于阈值直接失败） ----------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/seed.py",
  "*/__init__.py",
  "tests/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
