# 本机 Compose 部署：GHCR 镜像 + SQLite 落盘（对应部署工程化.md §五/§十三）
# 用法：powershell -File deploy/deploy.ps1（默认 latest；指定版本加 -Tag v0.3.19）
# 回滚：powershell -File deploy/deploy.ps1 -Tag <上一个版本号>
name: reai

services:
  backend:
    image: ghcr.io/huqingyuan0707/reai-backend:${REAI_TAG:-latest}
    environment:
      # 本地演示栈：SQLite 落 volume，种子默认开（账号见 backend/.env.example 的 SEED_*，本机专用）。
      # 生产分家：改用 docker-compose.prod.yml 覆盖（ENV=prod + 三种子开关全关 + JWT_SECRET 必填），
      # 首个管理员用 backend/scripts/create_admin.py 创建，绝不把演示口令带上生产。
      DATABASE_URL: sqlite+aiosqlite:///./data/dev.db
      SEED_ON_START: 'true'
      # 本地 Vite 联调（5173）跨域放行；经 8080 Nginx 同源访问则不受影响
      CORS_ORIGINS: '["http://127.0.0.1:5173", "http://localhost:5173"]'
      # 容器内 127.0.0.1 指自身，宿主 Ollama 经 host 网关访问（Docker Desktop 可用；连不上走片段摘要降级不断流）
      LLM_BASE_URL: 'http://host.docker.internal:11434/v1'
    volumes:
      - backend-data:/srv/app/data
    ports:
      - '8000:8000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/huqingyuan0707/reai-frontend:${REAI_TAG:-latest}
    environment:
      # 同源反代目标（/api → 后端）：默认即镜像内置值，显式声明便于改地址（如外置后端改 host:port 后重起，无需卷挂载覆盖配置）
      BACKEND_UPSTREAM: 'backend:8000'
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # 更新唯一入口（ADR-0002 不可变部署）：deploy.ps1 -Tag <短 sha 或版本号> 显式拉取指定 tag。
  # 禁止 watchtower 等任何自动更新器：轮询拉起会与回滚切 tag 打架（回滚 5 分钟内被改回去），
  # 且让运行中镜像 digest 脱离部署记录、无审计可查；连带省掉 docker.sock 特权挂载。

volumes:
  backend-data:
