# 本地门禁：与 CI 同规则，先拦后推（对应 AGENTS.md §6 / 测试评估验收方案.md §7）
# 安装：pip install pre-commit ; pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 必须与 CI 安装的 ruff 版本一致（ci.yml「安装工具链」里钉 ruff==0.16.7）：
    # 两处版本一旦漂移，格式化口径就不同（0.16 会合并能放下单行的调用），
    # 本地绿灯、CI 的 ruff format --check 必红。升级时两边同步改。
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [check, backend]
      - id: ruff-format
        args: [backend]

  - repo: local
    hooks:
      # 后端类型检查（与 CI mypy app 同口径）
      - id: mypy-app
        name: mypy app
        entry: mypy app
        language: system
        pass_filenames: false
        files: ^backend/
      # 后端改接口必须自查 openapi（无 openapi.json 时跳过，只提醒）
      # 注：entry 整行须为 YAML 单引号标量（内层单引号双写转义）：python 文案里的 `SKIP: ` 冒号会让裸标量解析失败
      - id: openapi-guard
        name: openapi自查提醒
        entry: 'python -c "import pathlib,sys; p=pathlib.Path(''backend/openapi.json''); print(''openapi.json exists'' if p.exists() else ''SKIP: backend/openapi.json 不存在，接口改动请补自查'')"'
        language: system
        pass_filenames: false
        files: ^backend/app/api/
      # 前端 lint-staged 委托（与 frontend/package.json 同口径，避免双写规则）
      - id: frontend-lint-staged
        name: frontend lint-staged
        entry: sh -c "cd frontend && pnpm exec lint-staged"
        language: system
        pass_filenames: false
        files: ^frontend/
      # 文档联动提醒：改代码未改对应文档时警告（强拦在 CI docs-guard）
      - id: docs-link-reminder
        name: 文档联动提醒
        entry: python scripts/check_docs_link.py
        language: system
        pass_filenames: false
        stages: [pre-push]
      # 大文件门禁：新增超 100KB 二进制直入库即拦（治历史只增不减；二进制走 LFS，强拦在 CI large-files）
      - id: large-files-guard
        name: 大文件门禁（100KB 二进制）
        entry: python scripts/check_large_files.py
        language: system
        pass_filenames: false
      # 工具链门禁：Node/pnpm 三处声明必须对齐（源头 .nvmrc + packageManager，强拦在 CI toolchain）
      - id: toolchain-guard
        name: 工具链对齐（Node/pnpm）
        entry: python scripts/check_toolchain.py
        language: system
        pass_filenames: false
      # 版本门禁：项目版本三源必须对齐（源头 执行步骤.md 头部版本，强拦在 CI version）
      - id: version-guard
        name: 项目版本三源对齐
        entry: python scripts/check_version.py
        language: system
        pass_filenames: false
